name: Scheduled Quran Long-Form Compilation
on:
  schedule:
    # 03:00 UTC is 06:00 Asia/Riyadh; Cairo local time varies with DST.
    - cron: '0 3 * * 0,3,5'
  workflow_dispatch:
    inputs:
      reciter:
        description: 'Reviewed reciter selection'
        type: choice
        default: auto
        options: [auto, alafasy, shuraym, sudais, husary, shaatree, maher_muaiqly, abdul_basit_mujawwad, abdul_basit_murattal, minshawi_mujawwad, hudhaify, banna]
      test_mode:
        description: 'Read-only preview; no rendering, uploads or notifications'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    uses: ./.github/workflows/publishing.yml
    with:
      route: longform
      reciter: ${{ inputs.reciter || 'auto' }}
      schedule: ${{ github.event.schedule || '' }}
      test_mode: ${{ inputs.test_mode || false }}
    secrets: inherit
