name: Daily Quran Growth Engine
on:
  schedule:
    # Asia/Riyadh UTC+3; expired events skip in ci_run.py.
    - cron: '0 2 * * *'
    - cron: '0 18 * * 0-4,6'
    - cron: '0 18 * * 5'
    - cron: '0 19 * * 6'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing slot (sleep format currently unavailable)'
        type: choice
        default: auto
        options: [auto, morning_short, evening_short, friday_long, saturday_sleep]
      dry_run:
        description: 'Read-only decision; no stores, rendering or services'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    uses: ./.github/workflows/publishing.yml
    with:
      route: growth
      slot: ${{ inputs.slot || 'auto' }}
      schedule: ${{ github.event.schedule || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
