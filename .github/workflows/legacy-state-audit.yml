name: Audit legacy YouTube publishing state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only YouTube API dependencies
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib loguru python-dotenv
      - name: Load existing owner credentials locally
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        run: python scripts/ci_state.py credentials
      - name: Compare legacy history with actual video state
        env:
          PYTHON_DOTENV_DISABLED: '1'
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          QRM_AUDIT_OUTPUT: ${{ runner.temp }}/legacy-youtube-state.json
        run: python -m scripts.audit_legacy_youtube --output "$QRM_AUDIT_OUTPUT"
      - name: Keep the read-only recovery report
        uses: actions/upload-artifact@v4
        with:
          name: legacy-youtube-state
          path: ${{ runner.temp }}/legacy-youtube-state.json
          retention-days: 14
          if-no-files-found: error
